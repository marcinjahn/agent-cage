name: build

# Daily rebuild keeps Claude Code + the toolchain at latest (DESIGN §5).
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - etc/**
      - .github/workflows/build.yml

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agent-cage

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        # GHCR reads the package description from the index/manifest annotation,
        # not the image-config LABEL — so emit annotations at the index level too.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.description=Claude Code in a cage, sandboxed with --dangerously-skip-permissions and packed with various dev tools

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Forces the Dockerfile's "latest" installs (Claude Code, Antigravity,
          # Copilot, ctx7, pnpm, ccusage) to actually re-run each build instead of
          # replaying a stale gha-cached layer (see the Dockerfile comment) —
          # otherwise the daily schedule would rebuild without fetching anything new.
          build-args: CACHEBUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
